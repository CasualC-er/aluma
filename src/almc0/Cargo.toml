[package]
name = "almc0"
description = "Stage-0 Alúma compiler: .alm source to canonical IR (ADR-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alm-core = { workspace = true }

[dev-dependencies]
# The conformance harness, used by the corpus integration test. A dev-dependency
# rather than a dependency: the compiler must not depend on its own test harness.
almtest = { path = "../almtest" }

[lints.rust]
unsafe_code = "forbid"
